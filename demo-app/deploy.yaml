# __IMAGE__ 会被流水线换成这次构建出的镜像。Deployment 名字必须和仓库名一致。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: NodePort
  selector: { app: demo-app }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30090
