name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: make test PYTHON=python

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Start cluster and mini-ci
        run: make up
      - name: End-to-end tests
        run: make e2e
      - name: Dump cluster state
        if: failure()
        run: |
          kubectl --context kind-cicd -n ci get pipelineruns,pods,pvc -o wide || true
          kubectl --context kind-cicd -n ci logs deploy/ci-operator --tail=300 || true
          kubectl --context kind-cicd -n ci logs deploy/ci-webhook --tail=100 || true
          kubectl --context kind-cicd -n ci get events --sort-by=.lastTimestamp | tail -50 || true
