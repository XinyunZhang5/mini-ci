name: Demo site

# 把网页原样发布到 GitHub Pages。那里没有后端,网页会自动进入演示模式(demo.js 的模拟数据)。
on:
  push:
    branches: [main]
    paths: ["controller/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 排队等上一次发布完成,不取消它:被取消的发布会在提交上显示成失败
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: controller/static
      - id: deployment
        uses: actions/deploy-pages@v4
